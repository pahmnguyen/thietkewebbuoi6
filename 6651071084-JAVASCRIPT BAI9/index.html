<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form Validation Exercise</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="form-container">
        <h3>Personal Information</h3>
        <form id="regForm">
            <div class="form-group">
                <label>Enter name*:</label>
                <input type="text" id="fullname" name="fullname">
            </div>
            <div class="form-group">
                <label>Sex*:</label>
                <div class="radio-group">
                    <input type="radio" name="sex" value="Male" id="male"> <label for="male">Male</label>
                    <input type="radio" name="sex" value="Female" id="female"> <label for="female">Female</label>
                </div>
            </div>
            <div class="form-group">
                <label>Enter email address*:</label>
                <input type="text" id="email" name="email">
            </div>
            <div class="form-group">
                <label>Enter birthday (MM/DD/YYYY)*:</label>
                <input type="text" id="birthday" name="birthday" placeholder="MM/DD/YYYY">
            </div>
            <div class="form-group">
                <label>Enter street address (line 1)*:</label>
                <input type="text" id="address" name="address">
            </div>
            <div class="form-group">
                <label>Enter city*:</label>
                <input type="text" id="city" name="city">
            </div>
            <div class="form-group">
                <label>Select a region*:</label>
                <select id="region" name="region">
                    <option value="">-- Chọn vùng --</option>
                    <option value="HN">Hà Nội</option>
                    <option value="HCM">TP. Hồ Chí Minh</option>
                    <option value="DN">Đà Nẵng</option>
                </select>
            </div>
            <div class="form-group">
                <label>Enter 5 digit Zip code*:</label>
                <input type="text" id="zipcode" name="zipcode">
            </div>
            <div class="btn-group">
                <button type="button" id="btnFinish">Finish</button>
                <button type="button" id="btnClear">Clear</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
